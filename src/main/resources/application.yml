#connecting to a database
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/test}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
      #show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:pass@localhost:27017/admin}
      database: ${MONGODB_DATABASE:test}
      auto-index-creation: true